appId: com.tambal_ban
---
- launchApp

# Register -> exercises POST /api/v2/auth/register
- extendedWaitUntil:
    visible:
      id: "com.tambal_ban:id/ivUserAvatar"
    timeout: 15000
- tapOn:
    id: "com.tambal_ban:id/ivUserAvatar"
- assertVisible: "Masuk ke Akun Anda"
- tapOn: "Daftar"
- assertVisible: "Daftar Akun"
- tapOn:
    below: "Nama Lengkap"
- inputText: "Maestro QA 1787917123"
- tapOn:
    below: "Alamat Email"
- inputText: "maestro-qa-1787917123@example.com"
- tapOn:
    below: "Kata Sandi"
- inputText: "MaestroQA123!"
- tapOn: "Daftar Sekarang"

# Back on map (MainActivity) after auto-login -> exercises GET /api/v2/workshops
- assertVisible:
    id: "com.tambal_ban:id/ivUserAvatar"

# Profile -> exercises GET /api/v2/profile
- tapOn:
    id: "com.tambal_ban:id/ivUserAvatar"
- assertVisible: "Profil"
- assertVisible: "Edit Profil"

# Add workshop -> exercises POST /api/v2/workshops (+ upload if photo step succeeds)
- tapOn: "Tambah Tambal Ban"
- assertVisible: "Tambah Tambal Ban"
- tapOn:
    below: "Nama Tambal Ban"
- inputText: "Tambal Ban Maestro QA"
- tapOn:
    below: "Alamat Lengkap"
- inputText: "Jl. Maestro QA No. 1"
- tapOn:
    below: "Kota"
- inputText: "Jakarta"
- tapOn:
    below: "Nomor Telepon"
- inputText: "081234567890"
- tapOn:
    below: "Latitude"
- inputText: "-6.2"
- tapOn:
    below: "Longitude"
- inputText: "106.8"

# Photo attach is best-effort: OEM photo pickers vary, don't fail the whole smoke test on this step
- tapOn:
    id: "com.tambal_ban:id/cardAddPhoto"
    optional: true
- tapOn:
    text: ".*"
    optional: true

- tapOn: "Kirim"
- assertVisible:
    text: "Tambal Ban berhasil ditambahkan!"
    optional: true
